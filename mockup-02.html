<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Nanaimo Youth Coalition — Bold Campaign Concept</title>
  <style>
    :root { --ink: #12121b; --paper: #fffaf0; --turquoise: #18d2d0; --coral: #ff6552; --yellow: #ffe350; --ultraviolet: #6954e8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--ink); color: var(--paper); font-family: Arial, Helvetica, sans-serif; }
    main { width: min(1440px, calc(100% - 2rem)); margin: 0 auto; padding: 2rem 0 3rem; }
    .label { display: inline-block; margin-bottom: 1rem; padding: .45rem .7rem; background: var(--turquoise); color: var(--ink); font-size: .76rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
    h1 { max-width: 960px; margin: 0 0 .8rem; font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; font-size: clamp(2.6rem, 6.2vw, 6.7rem); font-weight: 900; line-height: .82; letter-spacing: -.04em; text-transform: uppercase; }
    p { max-width: 720px; margin: 0 0 2rem; color: rgba(255,250,240,.82); font-size: 1rem; line-height: 1.5; }
    figure { margin: 0; border: 8px solid var(--paper); box-shadow: 16px 16px 0 var(--coral), 26px 26px 0 var(--ultraviolet); }
    img { display: block; width: 100%; height: auto; background: #28283a; }
    figcaption { margin-top: 1.8rem; color: var(--yellow); font-size: .86rem; font-weight: 750; letter-spacing: .03em; }
    @media (max-width: 650px) { main { width: min(100% - 1.25rem, 1440px); padding-top: 1.25rem; } figure { border-width: 4px; box-shadow: 8px 8px 0 var(--coral), 13px 13px 0 var(--ultraviolet); } }
  </style>
</head>
<body>
  <main>
    <span class="label">Concept B · Bold campaign · not live</span>
    <h1>Youth advocacy, not another brochure.</h1>
    <p>A sharper campaign direction for Nanaimo Youth Coalition: high contrast, strong youth voice and a direct invitation to act. This visual does not change the published website.</p>
    <figure>
      <img src="/manus-storage/async-images/6Wrb69fkESZK4ZOb5prrHK/image-1.webp" alt="Bold youth-advocacy campaign concept for Nanaimo Youth Coalition.">
    </figure>
    <figcaption>Concept elements: direct civic-campaign language, powerful youth photography, oversized advocacy typography and action-first colour blocks.</figcaption>
  </main>
</body>
</html>
